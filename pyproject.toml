[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "treegov"
version = "1.0.0a3"
description = "Governed decision trees for credit risk — CHAID, C&RT, QUEST with native MRM/IFRS 9."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Marco Rengel"},
]
keywords = ["credit-risk", "decision-trees", "chaid", "crt", "quest", "mrm", "ifrs9"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "PySide6>=6.5",
    "pyarrow>=12.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/Marco-Rengel/treegov"
Repository = "https://github.com/Marco-Rengel/treegov"

[tool.setuptools]
packages = ["backend_v3", "frontend_v3"]

[tool.setuptools.package-data]
frontend_v3 = ["resources/*.qss"]